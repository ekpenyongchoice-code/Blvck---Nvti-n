<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="description"
content="BLVCK NVTI∆N — Where Royalty Redefines Reality. A luxury African lifestyle and entertainment house spanning music, film, content creation, fashion, leisure and culture.">

<meta name="theme-color" content="#050505">

<title>BLVCK NVTI∆N | Where Royalty Redefines Reality</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   BLVCK NVTI∆N — LUXURY CREATIVE HOUSE
   ========================================================= */

:root{
    --black:#030303;
    --black-soft:#080808;
    --black-light:#111111;

    --gold:#d4af37;
    --gold-light:#f5d77a;
    --gold-deep:#9b7419;

    --white:#f8f5ed;
    --cream:#e9e0cc;

    --muted:#a7a29a;

    --border:rgba(212,175,55,.22);
    --border-strong:rgba(212,175,55,.5);

    --serif:'Cormorant Garamond',serif;
    --sans:'Montserrat',sans-serif;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

html{
    background:var(--black);
}

body{
    background:
        radial-gradient(circle at 50% 10%,rgba(212,175,55,.07),transparent 28%),
        var(--black);

    color:var(--white);
    font-family:var(--sans);
    line-height:1.7;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.18;

    background-image:
        linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);

    background-size:70px 70px;
    z-index:-2;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    font-family:inherit;
}

img{
    max-width:100%;
    display:block;
}

.container{
    width:min(1180px,90%);
    margin:auto;
}

/* =========================================================
   GOLD TEXT
   ========================================================= */

.gold{
    color:var(--gold);
}

.gold-gradient{
    background:linear-gradient(
        120deg,
        var(--gold-deep),
        var(--gold-light),
        var(--gold),
        var(--gold-deep)
    );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

/* =========================================================
   HEADER
   ========================================================= */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;

    background:rgba(3,3,3,.88);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
}

.nav{
    width:min(1250px,92%);
    height:88px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    display:flex;
    align-items:center;
}

.brand img{
    width:175px;
    height:62px;
    object-fit:contain;
    object-position:center;
    filter:drop-shadow(0 0 10px rgba(212,175,55,.12));
}

/* desktop navigation */

.nav-links{
    display:flex;
    align-items:center;
    gap:30px;
}

.nav-links a{
    position:relative;

    font-size:11px;
    font-weight:500;
    letter-spacing:3px;
    color:#d8d3ca;

    transition:.3s ease;
}

.nav-links a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-9px;
    width:0;
    height:1px;
    background:var(--gold);

    transition:.3s ease;
}

.nav-links a:hover{
    color:var(--gold);
}

.nav-links a:hover::after{
    width:100%;
}

/* menu */

.menu-toggle{
    display:none;

    width:46px;
    height:46px;

    background:transparent;
    border:1px solid var(--border);

    cursor:pointer;

    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:5px;
}

.menu-toggle span{
    width:20px;
    height:1px;
    background:var(--gold);
    transition:.3s;
}

/* =========================================================
   HERO
   ========================================================= */

.hero{
    min-height:100vh;
    padding-top:88px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
    overflow:hidden;

    text-align:center;
}

.hero::before{
    content:"";
    position:absolute;

    width:850px;
    height:850px;

    border:1px solid rgba(212,175,55,.12);
    border-radius:50%;

    top:50%;
    left:50%;

    transform:translate(-50%,-45%);
}

.hero::after{
    content:"";
    position:absolute;

    width:1100px;
    height:1100px;

    border:1px solid rgba(212,175,55,.07);
    border-radius:50%;

    top:50%;
    left:50%;

    transform:translate(-50%,-45%);
}

.hero-inner{
    width:min(900px,90%);
    position:relative;
    z-index:2;

    animation:heroReveal 1.4s ease forwards;
}

@keyframes heroReveal{
    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.hero-logo{
    width:min(670px,92%);
    margin:0 auto 45px;

    filter:
        drop-shadow(0 0 25px rgba(212,175,55,.13))
        drop-shadow(0 20px 45px rgba(0,0,0,.8));
}

.hero-kicker{
    font-size:11px;
    letter-spacing:6px;
    color:#bcb7ae;
    margin-bottom:20px;
}

.hero h1{
    font-family:var(--serif);
    font-size:clamp(42px,7vw,82px);
    font-weight:500;
    line-height:1;

    margin-bottom:22px;
}

.hero h1 span{
    color:var(--gold);
}

.hero-tagline{
    font-family:var(--serif);
    font-style:italic;

    font-size:clamp(22px,3vw,34px);

    color:var(--gold-light);

    margin-bottom:25px;
}

.hero-categories{
    font-size:10px;
    letter-spacing:4px;
    color:#aaa49b;

    margin-bottom:40px;
}

.hero-categories span{
    color:var(--gold);
    margin:0 7px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    min-width:205px;
    padding:17px 28px;

    border:1px solid var(--gold);

    color:var(--gold-light);

    font-size:10px;
    font-weight:600;
    letter-spacing:3px;

    background:rgba(212,175,55,.025);

    transition:.35s ease;
}

.btn:hover{
    background:var(--gold);
    color:#050505;

    box-shadow:
        0 0 30px rgba(212,175,55,.2);
}

.scroll-note{
    margin-top:60px;

    font-size:9px;
    letter-spacing:4px;
    color:#77716a;
}

.scroll-line{
    width:1px;
    height:45px;

    background:linear-gradient(
        var(--gold),
        transparent
    );

    margin:12px auto 0;
}

/* =========================================================
   SECTION STRUCTURE
   ========================================================= */

section{
    position:relative;
    padding:120px 0;
}

.section-label{
    font-size:9px;
    letter-spacing:5px;
    color:var(--gold);

    margin-bottom:17px;
}

.section-title{
    font-family:var(--serif);

    font-size:clamp(40px,6vw,70px);
    line-height:1.05;

    font-weight:500;

    margin-bottom:25px;
}

.section-title span{
    color:var(--gold);
}

.section-intro{
    max-width:680px;

    color:#a9a49b;

    font-size:14px;
    line-height:2;

    margin-bottom:55px;
}

/* =========================================================
   GOLD DIVIDER
   ========================================================= */

.gold-divider{
    width:80px;
    height:1px;

    background:var(--gold);

    margin:30px 0;
}

.gold-divider.center{
    margin:30px auto;
}

/* =========================================================
   ABOUT
   ========================================================= */

.about{
    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(212,175,55,.025),
            transparent
        );
}

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:80px;

    align-items:center;
}

.about-copy p{
    color:#aaa49b;
    font-size:14px;
    line-height:2;
    margin-bottom:22px;
}

.about-mark{
    min-height:450px;

    border:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    background:
        radial-gradient(
            circle,
            rgba(212,175,55,.08),
            transparent 60%
        );
}

.about-mark::before{
    content:"";

    position:absolute;
    inset:25px;

    border:1px solid rgba(212,175,55,.12);
}

.about-mark img{
    width:75%;
    position:relative;
    z-index:2;
}

/* =========================================================
   THE WORLD
   ========================================================= */

.world{
    background:var(--black-soft);
}

.world-header{
    text-align:center;
    max-width:780px;
    margin:auto;
}

.world-header .section-intro{
    margin-left:auto;
    margin-right:auto;
}

.world-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.world-card{
    min-height:350px;

    padding:45px;

    border:1px solid var(--border);

    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            rgba(212,175,55,.035),
            rgba(255,255,255,.01)
        );

    transition:.45s ease;
}

.world-card::before{
    content:"";

    position:absolute;

    width:200px;
    height:200px;

    border:1px solid rgba(212,175,55,.09);
    border-radius:50%;

    right:-70px;
    bottom:-70px;

    transition:.45s ease;
}

.world-card:hover{
    transform:translateY(-7px);
    border-color:var(--border-strong);

    box-shadow:
        0 25px 70px rgba(0,0,0,.35);
}

.world-card:hover::before{
    transform:scale(1.3);
}

.card-number{
    font-family:var(--serif);
    font-size:18px;
    color:var(--gold);

    margin-bottom:25px;
}

.world-card h3{
    font-family:var(--serif);
    font-size:38px;
    font-weight:500;

    margin-bottom:15px;
}

.world-card p{
    color:#99938a;
    font-size:13px;
    line-height:1.9;

    max-width:500px;
}

.card-link{
    display:inline-block;

    margin-top:28px;

    color:var(--gold);

    font-size:9px;
    letter-spacing:3px;
}

/* =========================================================
   ENTERTAINMENT
   ========================================================= */

.entertainment{
    background:#050505;
}

.entertainment-intro{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:80px;

    align-items:end;

    margin-bottom:55px;
}

.entertainment-intro p{
    color:#9c968d;
    font-size:14px;
    line-height:2;
}

.entertainment-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1px;

    background:var(--border);
}

.ent-card{
    min-height:330px;

    padding:42px 32px;

    background:#050505;

    position:relative;

    transition:.35s ease;
}

.ent-card:hover{
    background:#0d0d0d;
}

.ent-icon{
    width:55px;
    height:55px;

    border:1px solid var(--gold);

    display:flex;
    align-items:center;
    justify-content:center;

    color:var(--gold);

    font-family:var(--serif);
    font-size:22px;

    margin-bottom:32px;
}

.ent-card h3{
    font-family:var(--serif);
    font-size:32px;
    font-weight:500;

    margin-bottom:14px;
}

.ent-card p{
    color:#918c84;
    font-size:12px;
    line-height:1.9;
}

/* =========================================================
   MUSIC FEATURE
   ========================================================= */

.music-feature{
    margin-top:70px;

    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);

    padding:55px 0;
}

.music-grid{
    display:grid;
    grid-template-columns:1.1fr .9fr;
    gap:70px;

    align-items:center;
}

.music-feature h3{
    font-family:var(--serif);
    font-size:48px;
    font-weight:500;
}

.music-feature p{
    color:#9c968d;
    font-size:13px;
    line-height:2;

    margin:20px 0 28px;
}

.music-note{
    text-transform:uppercase;

    font-size:9px;
    letter-spacing:4px;
    color:var(--gold);
}

.sound-box{
    min-height:240px;

    border:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
}

.sound-box::before{
    content:"";

    position:absolute;

    width:150px;
    height:150px;

    border:1px solid rgba(212,175,55,.25);
    border-radius:50%;
}

.sound-symbol{
    font-family:var(--serif);
    color:var(--gold);

    font-size:60px;

    position:relative;
}

/* =========================================================
   FILM
   ========================================================= */

.film{
    background:
        radial-gradient(
            circle at 80% 50%,
            rgba(212,175,55,.06),
            transparent 35%
        ),
        var(--black-soft);
}

.film-layout{
    display:grid;
    grid-template-columns:.8fr 1.2fr;
    gap:80px;

    align-items:center;
}

.film-frame{
    aspect-ratio:4/5;

    border:1px solid var(--border);

    padding:15px;

    position:relative;
}

.film-inner{
    width:100%;
    height:100%;

    border:1px solid rgba(212,175,55,.16);

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    background:
        radial-gradient(
            circle,
            rgba(212,175,55,.08),
            transparent 65%
        );
}

.film-inner span{
    font-family:var(--serif);
    font-size:55px;
    color:var(--gold);
}

.film-copy p{
    color:#9d978e;
    font-size:14px;
    line-height:2;
    margin-bottom:20px;
}

/* =========================================================
   CONTENT CREATION
   ========================================================= */

.content-studio{
    background:#040404;
}

.studio-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.studio-card{
    padding:40px 30px;

    min-height:280px;

    border:1px solid var(--border);

    background:
        linear-gradient(
            160deg,
            rgba(212,175,55,.025),
            transparent
        );
}

.studio-card h3{
    font-family:var(--serif);
    font-size:30px;
    font-weight:500;

    margin:20px 0 12px;
}

.studio-card p{
    color:#918b83;
    font-size:12px;
    line-height:1.9;
}

/* =========================================================
   FASHION
   ========================================================= */

.fashion{
    background:var(--black-soft);
}

.fashion-header{
    text-align:center;
    max-width:800px;
    margin:auto auto 60px;
}

.fashion-header .section-intro{
    margin-left:auto;
    margin-right:auto;
}

.fashion-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.fashion-card{
    min-height:300px;

    padding:28px 22px;

    border:1px solid var(--border);

    display:flex;
    flex-direction:column;
    justify-content:flex-end;

    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            180deg,
            rgba(212,175,55,.015),
            rgba(0,0,0,.8)
        );

    transition:.4s;
}

.fashion-card:hover{
    transform:translateY(-8px);
    border-color:var(--gold);
}

.fashion-card::before{
    content:"";

    position:absolute;

    top:25px;
    right:25px;

    width:70px;
    height:70px;

    border:1px solid rgba(212,175,55,.13);
    border-radius:50%;
}

.fashion-card h3{
    font-family:var(--serif);
    font-size:28px;
    font-weight:500;

    position:relative;
}

.fashion-card p{
    color:#8f8981;
    font-size:11px;

    position:relative;
}

/* =========================================================
   LIFESTYLE
   ========================================================= */

.lifestyle{
    padding-bottom:80px;
}

.lifestyle-grid{
    display:grid;
    grid-template-columns:1fr 1fr;

    border-top:1px solid var(--border);
    border-left:1px solid var(--border);
}

.life-item{
    padding:55px 40px;

    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
}

.life-item h3{
    font-family:var(--serif);
    font-size:34px;
    font-weight:500;

    margin-bottom:15px;
}

.life-item p{
    color:#969087;
    font-size:12px;
    line-height:1.9;
}

/* =========================================================
   EVENTS
   ========================================================= */

.events{
    background:#050505;
}

.event-banner{
    border:1px solid var(--border);

    padding:70px 45px;

    text-align:center;

    background:
        radial-gradient(
            circle,
            rgba(212,175,55,.08),
            transparent 60%
        );
}

.event-banner h3{
    font-family:var(--serif);
    font-size:clamp(38px,6vw,65px);
    font-weight:500;
}

.event-banner p{
    max-width:650px;
    margin:20px auto 30px;

    color:#9c968d;
    font-size:13px;
}

/* =========================================================
   SCHOLÉ
   ========================================================= */

.schole{
    background:
        linear-gradient(
            180deg,
            var(--black-soft),
            var(--black)
        );
}

.schole-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:70px;

    align-items:center;
}

.schole-copy p{
    color:#9c968d;
    font-size:13px;
    line-height:2;
}

.schole-box{
    padding:50px;

    border:1px solid var(--border);

    background:
        radial-gradient(
            circle at center,
            rgba(212,175,55,.08),
            transparent 70%
        );
}

.schole-box h3{
    font-family:var(--serif);
    font-size:42px;
    font-weight:500;

    margin-bottom:15px;
}

/* =========================================================
   VISION
   ========================================================= */

.vision{
    text-align:center;

    padding:150px 0;

    background:
        radial-gradient(
            circle at center,
            rgba(212,175,55,.09),
            transparent 45%
        ),
        var(--black);
}

.vision-content{
    width:min(900px,90%);
    margin:auto;
}

.vision h2{
    font-family:var(--serif);
    font-size:clamp(44px,7vw,85px);

    line-height:1.05;

    font-weight:500;
}

.vision p{
    color:#a29c93;

    max-width:650px;
    margin:30px auto;

    font-size:14px;
    line-height:2;
}

/* =========================================================
   QUOTE
   ========================================================= */

.quote{
    padding:100px 0;

    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);

    text-align:center;
}

.quote-mark{
    font-family:var(--serif);
    font-size:70px;
    color:var(--gold);

    line-height:.5;
}

.quote p{
    width:min(850px,90%);
    margin:35px auto;

    font-family:var(--serif);
    font-size:clamp(28px,4vw,45px);

    font-style:italic;

    color:#e7dfcf;
}

.quote small{
    font-size:9px;
    letter-spacing:4px;
    color:var(--gold);
}

/* =========================================================
   LEADERSHIP
   ========================================================= */

.leadership{
    background:var(--black-soft);
}

.leadership-grid{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:70px;

    align-items:center;
}

.leadership-copy p{
    color:#9c968d;
    font-size:13px;
    line-height:2;
    margin-bottom:20px;
}

.leadership-card{
    min-height:420px;

    border:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    position:relative;
}

.leadership-card::before{
    content:"";

    position:absolute;
    inset:25px;

    border:1px solid rgba(212,175,55,.12);
}

.leadership-card h3{
    font-family:var(--serif);
    font-size:60px;
    font-weight:500;

    position:relative;
}

.leadership-card span{
    display:block;

    font-family:var(
